openapi: 3.1.0
info:
  title: Writ API
  version: 0.1.0
  description: |
    API for Writ, a multi-tenant CRM for political campaigns in Canada.

    This file is the single contract between the Go API and the web app.
    Change it first, run `make generate`, then implement.

    ## Versioning

    Every API endpoint lives under `/v1`. The only unversioned paths are the
    infrastructure probes `/healthz` and `/readyz`, which load balancers and
    the container orchestrator call.

    ## Authentication

    Every endpoint requires authentication and a permission check unless it
    is marked public with `security: []`.

    Clients sign in with the identity provider (OpenID Connect) and send the
    access token it issues as `Authorization: Bearer <token>`. The token
    must be a signed JWT. The API checks its signature against the
    provider's published keys, its issuer, its audience and its expiry. A
    missing or invalid token returns `401` with code `unauthenticated`;
    the response does not say which check failed. If the API cannot reach
    the provider to fetch its keys it returns `503` with code
    `service_unavailable`, and the client should retry rather than sign
    the user out.

    The first valid request from a new user creates their account. Their
    email address, name and language are copied from the identity provider
    then, and refreshed about once a day.

    A deployment may require multi-factor authentication. A token that is
    valid but was not obtained with a second factor then returns `401` with
    code `mfa_required`; the client should send the user to sign in again
    with a second factor.

    An account can be disabled in Writ itself. A valid token for a disabled
    account returns `401` with code `account_disabled`. Signing in again
    does not help; the client should tell the user their account is
    disabled.

    ## Errors

    Every error response, on every endpoint, has a body that follows the
    `Error` schema. `code` is stable and machine-readable; clients use it to
    choose a translated message. `message` is an English description for
    developers and must not be shown to end users. Error bodies never contain
    personal data.

    A resource in a tenant the caller does not belong to returns `404`, not
    `403`.

    ## Request IDs

    Every response carries an `X-Request-ID` header. A well-formed inbound
    `X-Request-ID` (at most 64 characters from `A-Z a-z 0-9 - _ .`) is
    reused; otherwise the server generates one. The same value appears as
    `request_id` in error bodies and in server logs.

    ## Pagination

    List endpoints use cursor pagination:

    - Request: the `cursor` and `limit` query parameters (see the `Cursor`
      and `Limit` parameters). Omit `cursor` for the first page.
    - Response: an object with `data` (the array of items) and `page` (a
      `PageInfo`). Pass `page.next_cursor` as `cursor` to get the next page.
      `page.next_cursor` is `null` on the last page.
    - Cursors are opaque. Clients must not parse, build or store them
      long-term. A cursor is only valid with the same filters and sort order
      that produced it; otherwise the API returns `400` with code
      `invalid_cursor`.
    - There are no page numbers, offsets or total counts.

    ## Naming

    JSON fields and query parameters use `snake_case`. Timestamps are
    RFC 3339 in UTC. Identifiers are UUIDs.
servers:
  - url: /
    description: The server this document was loaded from
  - url: http://localhost:8080
    description: Local development
tags:
  - name: health
    description: Liveness and readiness probes
  - name: account
    description: The signed-in user
  - name: tenants
    description: Tenants and the caller's membership of them
security:
  - bearerAuth: []
paths:
  /v1/tenants:
    get:
      operationId: listTenants
      summary: The signed-in user's tenants
      description: >-
        Lists the tenants the caller is an active member of, with the
        caller's role in each, oldest first. Needs no tenant, so clients call
        it after signing in to let the user choose one.
      tags: [tenants]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of tenants.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createTenant
      summary: Create a tenant
      description: >-
        Creates a tenant and makes the caller its owner. Unless the
        deployment allows self-service, only platform administrators may do
        this; anyone else gets `403`. The slug is generated and always
        unique, so this request never reports a conflict with another
        tenant.
      tags: [tenants]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantRequest"
            example:
              name: Example Riding Association
              default_locale: fr
      responses:
        "201":
          description: The new tenant. The caller's role in it is `owner`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/tenants/{tenant_id}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      operationId: getTenant
      summary: A tenant
      description: The tenant and the caller's role in it.
      tags: [tenants]
      responses:
        "200":
          description: The tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      operationId: updateTenant
      summary: Change a tenant's name or default language
      description: >-
        Owners and admins only. Send only the fields to change; at least one
        is required. The slug does not change.
      tags: [tenants]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantRequest"
            example:
              name: Example Riding Association
      responses:
        "200":
          description: The tenant after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/me:
    get:
      operationId: getMe
      summary: The signed-in user
      description: >-
        Returns the account of the user the access token belongs to. It needs
        no tenant, so clients call it first after signing in.
      tags: [account]
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
              example:
                id: 0192f0c4-7d2a-7b1e-9c3f-5a6b7c8d9e0f
                email: sam.example@example.test
                display_name: Sam Example
                locale: en
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      description: Reports that the process is running. Does not check dependencies.
      tags: [health]
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: ok
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe
      description: >-
        Reports whether the service can accept traffic. Returns 503 while a
        dependency check is failing or the service is shutting down.
      tags: [health]
      security: []
      responses:
        "200":
          description: The service is ready to accept traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: ok
        "503":
          description: The service is not ready to accept traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: unavailable
                checks:
                  database: failed
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: An access token issued by the identity provider.
  parameters:
    TenantId:
      name: tenant_id
      in: path
      required: true
      description: >-
        The tenant the request acts in. Every path under
        `/v1/tenants/{tenant_id}` returns `404` unless the caller is an active
        member of that tenant: for a tenant that does not exist, one that
        has been deleted, one the caller was never in, one where their
        membership is suspended, invited or removed, and for a value that is
        not a UUID. The response is the same in every case.
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: >-
        Opaque cursor from `page.next_cursor` of the previous page. Omit it
        to get the first page.
      schema:
        type: string
        minLength: 1
        maxLength: 1024
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 25
  responses:
    BadRequest:
      description: The request is malformed or a parameter is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: invalid_cursor
            message: The cursor is not valid for this request.
            request_id: 4f1c2a9e7b3d4c5e8f6a0b1c2d3e4f5a
    Unauthorized:
      description: >-
        Authentication is missing or invalid (code `unauthenticated`), or the
        token is valid but multi-factor authentication is required and was
        not used (code `mfa_required`), or the token is valid but the
        account has been disabled (code `account_disabled`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: unauthenticated
            message: Authentication is required.
            request_id: 4f1c2a9e7b3d4c5e8f6a0b1c2d3e4f5a
    Forbidden:
      description: >-
        The caller belongs to the tenant but lacks the permission for this
        action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: permission_denied
            message: The caller is not allowed to perform this action.
            request_id: 4f1c2a9e7b3d4c5e8f6a0b1c2d3e4f5a
    NotFound:
      description: >-
        The resource does not exist, or it belongs to a tenant the caller is
        not a member of.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: not_found
            message: The resource was not found.
            request_id: 4f1c2a9e7b3d4c5e8f6a0b1c2d3e4f5a
    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: conflict
            message: The resource was changed by another request.
            request_id: 4f1c2a9e7b3d4c5e8f6a0b1c2d3e4f5a
    ValidationFailed:
      description: The request body failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: validation_failed
            message: The request body is invalid.
            request_id: 4f1c2a9e7b3d4c5e8f6a0b1c2d3e4f5a
            details:
              - field: display_name
                code: required
                message: display_name is required.
    TooManyRequests:
      description: The caller has sent too many requests.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            format: int32
            minimum: 0
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: rate_limited
            message: Too many requests.
            request_id: 4f1c2a9e7b3d4c5e8f6a0b1c2d3e4f5a
    InternalError:
      description: An unexpected error occurred on the server.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: internal_error
            message: An unexpected error occurred.
            request_id: 4f1c2a9e7b3d4c5e8f6a0b1c2d3e4f5a
    ServiceUnavailable:
      description: >-
        A service the API depends on is temporarily unavailable. The request
        was not processed and may be retried.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: service_unavailable
            message: Authentication is temporarily unavailable.
            request_id: 4f1c2a9e7b3d4c5e8f6a0b1c2d3e4f5a
  schemas:
    CurrentUser:
      type: object
      description: The signed-in user's own account.
      required: [id, email, display_name, locale, platform_admin]
      properties:
        id:
          type: string
          format: uuid
        platform_admin:
          type: boolean
          description: >-
            Whether the user may create tenants when the deployment does not
            allow self-service. It gives no access to any tenant: that still
            takes a membership.
        email:
          type: [string, "null"]
          description: >-
            `null` until the identity provider has supplied an address.
        display_name:
          type: string
          description: May be empty.
        locale:
          type: string
          enum: [en, fr]
          description: The language the user prefers for the interface.
    Error:
      type: object
      description: The body of every error response.
      required: [code, message, request_id]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          description: >-
            English description for developers. Not for display to end users.
        request_id:
          type: string
          description: The request ID, also returned in the `X-Request-ID` header.
        details:
          type: array
          description: Field-level problems, present on validation errors.
          items:
            $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        field:
          type: string
          description: >-
            Path of the offending field in the request, such as
            `display_name` or `addresses[0].postal_code`. Absent when the
            problem is not tied to one field.
        code:
          $ref: "#/components/schemas/ErrorDetailCode"
        message:
          type: string
          description: >-
            English description for developers. Not for display to end users.
    ErrorCode:
      type: string
      description: >-
        Stable, machine-readable error code. Clients use it to choose a
        translated message. This list is the complete set the API returns;
        the Go constants live in `api/internal/apierror/codes.go`. New codes
        may be added, so clients must handle unknown values.
      enum:
        - bad_request
        - invalid_cursor
        - unauthenticated
        - account_disabled
        - mfa_required
        - permission_denied
        - not_found
        - method_not_allowed
        - conflict
        - validation_failed
        - rate_limited
        - internal_error
        - service_unavailable
    ErrorDetailCode:
      type: string
      description: >-
        Stable, machine-readable reason a field or parameter was rejected.
        New codes may be added, so clients must handle unknown values.
      enum:
        - required
        - invalid
    Role:
      type: string
      description: >-
        A member's role in a tenant. `owner` has full control; `admin`
        manages the team, settings and data; `staff` does day-to-day work;
        `volunteer` has limited access to what is assigned to them.
      enum: [owner, admin, staff, volunteer]
    Locale:
      type: string
      description: A language the interface supports.
      enum: [en, fr]
    Tenant:
      type: object
      description: A tenant, as seen by one of its members.
      required: [id, name, slug, default_locale, role, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
          description: >-
            A short, unique, URL-safe identifier generated from the name when
            the tenant was created. It does not change when the name does.
        default_locale:
          $ref: "#/components/schemas/Locale"
        role:
          $ref: "#/components/schemas/Role"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      example:
        id: 0192f0c4-7d2a-7b1e-9c3f-5a6b7c8d9e0f
        name: Example Riding Association
        slug: example-riding-association-k3x9w2ab
        default_locale: fr
        role: owner
        created_at: "2026-11-13T15:04:05Z"
        updated_at: "2026-11-13T15:04:05Z"
    TenantList:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Tenant"
        page:
          $ref: "#/components/schemas/PageInfo"
    CreateTenantRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: 1 to 200 characters after trimming spaces.
        default_locale:
          $ref: "#/components/schemas/Locale"
    UpdateTenantRequest:
      type: object
      description: At least one field is required.
      properties:
        name:
          type: string
          description: 1 to 200 characters after trimming spaces.
        default_locale:
          $ref: "#/components/schemas/Locale"
    PageInfo:
      type: object
      description: Pagination state returned as `page` by every list endpoint.
      required: [next_cursor]
      properties:
        next_cursor:
          type: [string, "null"]
          description: >-
            Cursor for the next page, or `null` when this is the last page.
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: object
          description: Result of each dependency check, keyed by check name.
          additionalProperties:
            type: string
            enum: [ok, failed]
